version: '3.3'

services:
  jumper:
    image: kasmweb/chrome:1.18.0
    container_name: secure_jumper
    ports:
      - "6901:6901"
    shm_size: '512m'
    environment:
      # VNC password. Change this in a real environment.
      - VNC_PW=password
      # The URL to launch automatically
      - LAUNCH_URL=http://airflow-webserver:8080/
      # --- Security Hardening ---
      # Disable clipboard sharing
      - KASM_VNC_OPTIONS=-noremoteclipboard
      # Disable file uploads
      - KASM_FILE_UPLOADS_DISABLED=true
      # Disable file downloads
      - KASM_FILE_DOWNLOADS_DISABLED=true
      # Disable printing
      - KASM_PRINTING_DISABLED=true
      # Disable microphone access
      - KASM_MICROPHONE_DISABLED=true
      # Disable webcam access
      - KASM_WEBCAM_DISABLED=true
    depends_on:
      - airflow-webserver

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.8.1
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db init && airflow users create --username admin --password admin --firstname Anonymous --lastname User --role Admin --email admin@example.org"
    depends_on:
      - postgres

  airflow-webserver:
    image: apache/airflow:2.8.1
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=its_a_secret_key_for_dev
    container_name: airflow_webserver
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db init && airflow webserver"
    ports:
      - "8080:8080" # Exposing for direct access test, can be removed in production
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - postgres
      - airflow-init

  airflow-scheduler:
    image: apache/airflow:2.8.1
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    container_name: airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$HOSTNAME\""]
      interval: 30s
      timeout: 30s
      retries: 5
    depends_on:
      - postgres
      - airflow-init

volumes:
  postgres-db-volume:
  airflow-logs:
  airflow-plugins:
